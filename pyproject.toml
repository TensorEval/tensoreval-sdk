[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensoreval"
version = "1.0.0"
description = "TensorEval — Evaluation SDK for AI Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=2.36.0",
    "nest_asyncio>=1.6",
]

[project.optional-dependencies]
datasets = ["datasets>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["tensoreval"]
