[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensoreval"
version = "0.7.0"
description = "TensorEval — Evaluation SDK for AI Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["ruff>=0.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["tensoreval"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line-too-long (formatter handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["tensoreval"]
